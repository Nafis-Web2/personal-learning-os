
services:
  - type: web
    name: personal-learning-os-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./start_production.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
